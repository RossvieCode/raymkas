<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prochaine sortie · RAYMKAS</title>
<meta name="description" content="La prochaine sortie RAYMKAS au départ de Goma et Bukavu : date, prix, ce qui est compris et réservation sur WhatsApp.">
<meta name="theme-color" content="#123224">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@112..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=26">
</head>
<body class="page-sortie">

<header class="s-top">
  <a class="logo" href="./" data-brand aria-label="RAYMKAS, retour à l'accueil"></a>
  <div class="s-top-right">
    <a class="caps toplink s-back" href="./#journey">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4"/></svg>
      <span><span class="tl-long" data-i18n="sortie.allExpLong">Toutes les </span><span data-i18n="sortie.allExpShort">expériences</span></span>
    </a>
    <div class="lang" data-lang-switch></div>
  </div>
</header>

<main>
  <section class="s-head">
    <div class="wrap">
      <span class="caps trip-count" id="sCount"></span>
      <div class="s-title">
        <h1 class="display" data-i18n="sortie.h1">Prochaine sortie</h1>
        <span class="s-badge" id="sBadge" aria-hidden="true"><b class="display" id="sBadgeDay"></b><span id="sBadgeMonth"></span></span>
      </div>
      <div class="s-countdown" id="sCountdown" role="timer" aria-live="off"></div>
    </div>
    <div class="s-map" id="sMapWrap">
      <svg id="sMap" role="img" aria-label="Trajet depuis Goma et Bukavu"></svg>
      <a class="btn btn-sun s-book" id="sBook" href="#sTrips" data-i18n="sortie.bookNow">Réserve maintenant</a>
    </div>
  </section>

  <section class="s-trips">
    <div class="wrap" id="sTrips"></div>
  </section>

  <section class="s-more">
    <div class="wrap">
      <p data-i18n="sortie.moreText">Une question, ou envie d’une sortie privée à une autre date&nbsp;?</p>
      <div class="s-more-actions">
        <a class="btn btn-solid" data-whatsapp data-i18n="sortie.write">Écrire sur WhatsApp</a>
        <a class="btn btn-ghost" href="./#journey" data-i18n="sortie.seeAll">Voir toutes les expériences</a>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-grid">
    <div class="foot-brand">
      <a class="logo" href="./" data-brand></a>
      <p data-i18n="foot.tag">Des sorties au départ de Goma et Bukavu : transport, guide et photographe compris.</p>
    </div>
    <div class="lang lang-foot" data-lang-switch></div>
  </div>
  <div class="wrap foot-bottom"><span>© 2026 RAYMKAS</span><span>Goma . Bukavu</span></div>
</footer>

<script src="js/i18n.js?v=26"></script>
<script src="js/content.js?v=26"></script>
<script src="js/img-sizes.js?v=26"></script>
<script src="js/upcoming.js?v=26"></script>
<script src="js/map-data.js?v=26"></script>
<script src="js/map-draw.js?v=26"></script>
<script src="js/sortie.js?v=26"></script>
</body>
</html>
